# Every secret comes from the environment; nothing sensitive has a default.
spring:
  application:
    name: cep
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CEP_DB_URL:jdbc:postgresql://localhost:5432/cep}
    username: ${CEP_DB_USER:cep}
    password: ${CEP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${CEP_DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration   # scanned recursively: db/migration/<module>/V<yyyymmdd_nnnn>__*.sql
  data:
    redis:
      host: ${CEP_REDIS_HOST:localhost}
      port: ${CEP_REDIS_PORT:6379}
      password: ${CEP_REDIS_PASSWORD:}
      timeout: 500ms
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: cep

logging:
  structured:
    format:
      console: ${CEP_LOG_FORMAT:}   # set to "logstash" or "ecs" for JSON logs (compose does)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cep:
  security:
    jwt-secret: ${CEP_JWT_SECRET:}
    access-token-ttl: ${CEP_ACCESS_TOKEN_TTL:1h}
    cors-allowed-origins: ${CEP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap:
    tenant-key: ${CEP_BOOTSTRAP_TENANT:default}
    admin-email: ${CEP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${CEP_BOOTSTRAP_ADMIN_PASSWORD:}
  jobs:
    worker-enabled: ${CEP_WORKERS_ENABLED:true}
    worker-threads: ${CEP_WORKER_THREADS:2}
  outbox:
    relay-enabled: ${CEP_WORKERS_ENABLED:true}
